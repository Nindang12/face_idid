networks:
  faceid-network:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: faceid-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-faceid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faceid123}
      POSTGRES_DB: ${POSTGRES_DB:-faceid}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - faceid-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U faceid" ]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - faceid-network

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: faceid-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@faceid.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - faceid-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      # Cấu hình để các worker từ xa có thể kết nối
      # UPDATE: Advertise HOST_IP for external connections (required for distributed Spark/Remote workers)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${HOST_IP:-192.168.1.34}:9092,PLAINTEXT_INTERNAL://kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - faceid-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    networks:
      - faceid-network

  minio:
    image: minio/minio:latest
    container_name: faceid-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - faceid-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  web:
    build: .
    container_name: faceid-web
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      # Kết nối Kafka nội bộ trong Docker network
      # UPDATE: Dùng port 9093 (internal listener) vì port 9092 được advertise là localhost
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      SPARK_MASTER: ${SPARK_MASTER:-spark://${HOST_IP:-192.168.1.7}:7077}
      DATABASE_URL: postgresql://${POSTGRES_USER:-faceid}:${POSTGRES_PASSWORD:-faceid123}@postgres:5432/${POSTGRES_DB:-faceid}
      UPLOAD_DIR: /code/app/uploads
      KNOWN_FACES_DIR: /code/app/known_faces
      # MinIO Configuration
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-${HOST_IP:-192.168.1.9}:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-face-recognition-data}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    volumes:
      - ./app:/code/app
      - ./uploads:/code/app/uploads
      - ./known_faces:/code/app/known_faces
    networks:
      - faceid-network

  result-processor:
    build: .
    container_name: faceid-result-processor
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      # Kết nối Kafka nội bộ trong Docker network
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      DATABASE_URL: postgresql://${POSTGRES_USER:-faceid}:${POSTGRES_PASSWORD:-faceid123}@postgres:5432/${POSTGRES_DB:-faceid}
      # MinIO Configuration (same as web)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-${HOST_IP:-192.168.1.9}:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-face-recognition-data}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    volumes:
      - ./app:/code/app
      - ./uploads:/code/app/uploads
      - ./known_faces:/code/app/known_faces
    networks:
      - faceid-network
    # Run the result processor script
    command: python3 -m app.result_processor

volumes:
  postgres_data:
  minio_data:
